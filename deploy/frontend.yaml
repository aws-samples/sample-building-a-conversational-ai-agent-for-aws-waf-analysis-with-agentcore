AWSTemplateFormatVersion: '2010-09-09'
Description: WAF Analyst — Frontend (CloudFront + S3 + WAF). Deploy in us-east-1.

Parameters:
  # These exist because attaching a custom domain by hand is not survivable. CloudFormation owns the
  # whole DistributionConfig, so an alias and certificate added outside the template are REMOVED by
  # the next `cloudformation deploy` on this stack, with no warning and nothing in the changeset that
  # reads like "your domain will stop working". That happened on 2026-09-12 during an unrelated cache
  # policy change. `detect-stack-drift` reports the distribution MODIFIED beforehand, which is the
  # only signal, and it only helps if you think to look.
  #
  # **These parameters remove the drift, not every way to lose the domain.** `aws cloudformation
  # deploy` sends UsePreviousValue for every parameter you do not override, and the console's Update
  # wizard pre-fills from the current stack, so both are safe. Calling `update-stack` or
  # `create-change-set` directly is not: an omitted parameter falls back to the template default,
  # which here is the empty string, and the alias goes away again. That is a legitimate update rather
  # than drift, so `detect-stack-drift` will not warn you either. Use `deploy`.
  DomainName:
    Type: String
    Default: ""
    Description: >-
      Optional alternate domain name, for example waf.example.com. Leave empty to use the
      CloudFront domain. Requires AcmCertificateArn, and a Route53 (or other) record pointing at
      the distribution.
  AcmCertificateArn:
    Type: String
    Default: ""
    Description: >-
      Optional ACM certificate ARN covering DomainName. Must be issued in us-east-1, which is where
      CloudFront reads certificates from regardless of where the rest of your stack lives.

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref AcmCertificateArn, ""]]

Resources:
  # --- AWS WAF for Frontend ---
  FrontendWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${AWS::StackName}-waf
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${AWS::StackName}-waf
      Rules:
        - Name: AntiDDoS
          Priority: 0
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAntiDDoSRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AntiDDoS
        - Name: IPReputation
          Priority: 1
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: IPReputation
        - Name: RateLimit
          Priority: 2
          Statement:
            RateBasedStatement:
              Limit: 300
              EvaluationWindowSec: 60
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimit

  # --- S3 + CloudFront ---
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub ${FrontendBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref "AWS::NoValue"
        WebACLId: !GetAtt FrontendWebACL.Arn
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        # **One behaviour, nothing cached at the edge. Deliberate, and the trade is stated below so
        # it is not mistaken for an oversight.**
        #
        # A MinTTL-0 policy is the only thing that keeps `index.html` fresh, and a header cannot
        # substitute: a cache policy whose MinTTL is above zero caches for at least that long "even
        # if the Cache-Control: no-cache, no-store, or private directives are present in the origin
        # headers", and Managed-CachingOptimized has MinTTL 1. `index.html` is the only filename Vite
        # keeps stable across builds, so a cached copy keeps asking for the previous build's asset
        # hashes; measured on the first real browser visit after a redeploy, `Age: 3916`. Applying
        # that one policy to every path makes it unconditional, with no second behaviour whose
        # pattern has to be right.
        #
        # **What it costs.** The content-hashed bundle under /assets/ is not cached at the edge and
        # request collapsing is off, so concurrent first visitors each cause an S3 GET. That is worth
        # little on a single-tenant deployment and would matter on a busy one.
        #
        # **Browser caching survives this, and it survives only because of the upload.** CloudFront
        # forwards whatever `Cache-Control` the object carries, and the deployment guide sets
        # `max-age=31536000, immutable` on the hashed assets in a second `aws s3 sync` pass. So the
        # claim above is conditional: collapse those two passes back into one and nothing caches the
        # bundle anywhere, edge or browser, on every request. `test_frontend_template.py` asserts both
        # passes with their opposite headers, which is the only thing keeping this true.
        #
        # Putting /assets/* back on Managed-CachingOptimized is the better caching answer and needs
        # its own assertion in `tests/test_frontend_template.py`, which currently requires exactly
        # one behaviour.
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled, MinTTL 0
          Compress: true
        # 403 is mapped because S3 behind Origin Access Control answers a missing key with
        # AccessDenied, not NotFound. Mapping only 404 leaves every client-side deep link failing on
        # an unhandled 403.
        #
        # **`ErrorCachingMinTTL: 0` is the part that is easy to miss.** Defining this block at all
        # brings a default of 300 seconds, and the caching of error responses is asymmetric: for 404,
        # 410, 414 and 501 CloudFront honours `no-store`/`no-cache` from the origin, and for every
        # other status **including 403** it ignores them and caches for ErrorCachingMinTTL anyway. So
        # a request for a missing asset would be answered with index.html, status 200, cached at the
        # edge for five minutes, with no header able to prevent it. The browser then parses HTML as
        # JavaScript. Measured at 300 on the live distribution before this change.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

Outputs:
  CloudFrontDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
  FrontendBucket:
    Value: !Ref FrontendBucket
